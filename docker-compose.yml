services:
  mysql:
    image: mysql:8.0
    container_name: inkspace-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-inkspace123}
      MYSQL_DATABASE: inkspace
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表（脚本是幂等的 IF NOT EXISTS）
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 与本地开发用的独立 redis 容器（inkspace-redis）区分开，避免重名
    container_name: inkspace-redis-compose
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: inkspace-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: jdbc:mysql://mysql:3306/inkspace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-inkspace123}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（>=32 字节随机串）}
      # 浏览器跨域白名单（逗号分隔）。换成真实域名/端口时改这里，否则前端请求会被 403 拒绝
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:8088,http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      SHARE_BASE_URL: ${SHARE_BASE_URL:-http://localhost/share/}
      AI_MOCK: ${AI_MOCK:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      TZ: Asia/Shanghai
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: inkspace-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      # standalone 服务默认绑容器主机名，显式设为 0.0.0.0 才能被健康检查/其他容器访问
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: inkspace-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  uploads-data:
