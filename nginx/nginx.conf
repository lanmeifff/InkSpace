upstream inkspace_backend {
    server backend:8080;
}

upstream inkspace_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 6m;

    # 413 直接返回 JSON，避免前端拿到 nginx 的 HTML 错误页
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"code":40004,"message":"文件超过大小限制（图片最大 5MB）","data":null}';
    }

    # 后端 API；SSE 需要关闭缓冲并放宽读超时
    location /api/ {
        proxy_pass http://inkspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }

    # 用户上传的图片（由后端静态资源映射提供；生产可改为共享卷 + alias）
    location /uploads/ {
        proxy_pass http://inkspace_backend;
        proxy_set_header Host $host;
    }

    # 前端（Next.js standalone）
    location / {
        proxy_pass http://inkspace_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
